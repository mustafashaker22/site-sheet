<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>سايت شيت — جودة إيجي مكس</title>
<style>
:root{color-scheme:light only;--b:#1f4e78;--g:#1f7a3a;--r:#c0392b;--y:#e0a800;--bg:#eef1f4}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#222;font-size:calc(17px * var(--z,1));padding-bottom:90px;-webkit-text-size-adjust:100%}
header{background:var(--b);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}
header small{opacity:.85}
.net{font-size:12px;padding:3px 8px;border-radius:10px;background:#ffffff22}
.card{background:#fff;margin:10px;padding:12px;border-radius:12px;box-shadow:0 1px 3px #0002}
.card h3{margin:0 0 8px;font-size:calc(16px * var(--z,1));display:flex;justify-content:space-between;align-items:center;gap:6px}
label{font-size:calc(14px * var(--z,1));color:#666;display:block;margin-bottom:2px}
input,select,textarea{width:100%;font-size:calc(18px * var(--z,1));padding:10px 7px;border:1px solid #bbb;border-radius:8px;background:#fff;font-family:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{font-family:inherit;font-size:calc(17px * var(--z,1));border:0;border-radius:10px;padding:11px;cursor:pointer}
.btn{background:var(--b);color:#fff;width:100%}
.btn.g{background:var(--g)}.btn.y{background:#b9770e}.btn.r{background:var(--r)}.btn.l{background:#e8edf3;color:#1f4e78}
.big{font-size:calc(18px * var(--z,1));padding:15px}
.now{background:#e6f3ea;color:var(--g);font-weight:bold;width:100%;padding:12px 4px;font-size:calc(15px * var(--z,1))}
.tm input{text-align:center;font-weight:bold;color:var(--b)}
.tm label{text-align:center}
.mini{font-size:calc(13px * var(--z,1));padding:6px 10px;width:auto}
.del{background:#fde2e2;color:var(--r)}
.row{display:flex;gap:8px;align-items:center}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.st{font-size:calc(14px * var(--z,1));padding:3px 8px;border-radius:10px;white-space:nowrap}
.st.p{background:#fff3cd;color:#8a6d00}.st.s{background:#e3f0ff;color:#1f4e78}.st.f{background:#e6f3ea;color:var(--g)}
.alert{margin:10px;padding:10px;border-radius:10px;font-size:14px;line-height:1.7}
.alert.r{background:#fde2e2;border-right:5px solid var(--r)}.alert.y{background:#fff3cd;border-right:5px solid var(--y)}
.badge{font-size:calc(12px * var(--z,1));padding:2px 8px;border-radius:10px;background:#fde2e2;color:var(--r);font-weight:bold}
.badge.y{background:#fff3cd;color:#8a6d00}.badge.g{background:#e6f3ea;color:var(--g)}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;box-shadow:0 -2px 8px #0002;display:flex;gap:8px;z-index:6}
.muted{color:#666;font-size:calc(15px * var(--z,1))}
.ev{border-right:4px solid var(--y)}
.done{opacity:.75}
#sigWrap{position:fixed;inset:0;background:#000a;display:none;z-index:20;align-items:center;justify-content:center}
#sigBox{max-height:94vh;overflow:auto}
#sigBox{background:#fff;border-radius:12px;padding:12px;width:94%;max-width:520px}
#sig{width:100%;height:200px;border:2px dashed #999;border-radius:8px;touch-action:none;background:#fff}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;display:none}
.center{text-align:center}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}.chk input{width:auto}
body.zbig .g4{grid-template-columns:repeat(2,1fr)}
body.zbig .g3{grid-template-columns:repeat(2,1fr)}
</style>
</head>
<body>
<header><div><b>📋 سايت شيت</b><br><small id="who"></small></div><div style="display:flex;gap:6px;align-items:center"><button onclick="zoomUp()" style="background:#ffffff22;color:#fff;padding:5px 10px;font-size:15px">🔍 الخط</button><span class="net" id="net">…</span></div></header>
<div id="app"></div>
<div id="sigWrap"><div id="sigBox">
  <h3 style="margin:4px 0 8px">✍️ إمضاء الفني</h3>
  <div class="muted" id="sigWho"></div>
  <div id="sigFoot"></div>
  <label style="margin-top:8px">امضي هنا بصباعك</label>
  <canvas id="sig" width="1000" height="400"></canvas>
  <div class="g3" style="margin-top:8px"><button class="btn l" onclick="sigClear()">مسح</button><button class="btn l" onclick="sigClose()">رجوع</button><button class="btn g" onclick="finish()">✅ إنهاء وإرسال</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
// ===================== التخزين =====================
var KEY = 'qc_site_app_v1';
var S = load();
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ الذاكرة مليانة'); } }
S.reports = S.reports || {}; S.order = S.order || []; S.clients = S.clients || []; S.sites = S.sites || {}; S.disp = S.disp || []; S.dispToday = S.dispToday || [];
var qs = new URLSearchParams(location.search);
if (qs.get('api')) { S.api = qs.get('api'); save(); history.replaceState(null, '', location.pathname); }

var cur = null;   // التقرير المفتوح
var view = 'home';
var liveMsgs = {};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function esc(v) { return v == null ? '' : String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 2500); }
function mins(hm) { if (!hm) return null; var p = hm.split(':'); return (+p[0]) * 60 + (+p[1]); }
function since(hm) { var m = mins(hm); if (m == null) return null; var n = mins(nowHM()); return (n - m + 1440) % 1440; }

// ===================== الشبكة والمزامنة =====================
function setNet() {
  var pend = S.order.filter(function (id) { var r = S.reports[id]; return r && !r.closedSynced && !r.handedTo && ((r.data.rows || []).length || r.sid) && r.updatedAt > (r.syncedAt || 0); }).length + S.disp.filter(function (d) { return !d.synced; }).length + (S.prod || []).filter(function (d) { return !d.synced; }).length;
  document.getElementById('net').textContent = (navigator.onLine ? '🟢 متصل' : '🔴 من غير نت') + (pend ? ' · ⏳ ' + pend : '');
}
function api(body) {
  return fetch(S.api, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (res) {
    if (res && res.resetAt) purgeBefore(res.resetAt);
    return res;
  });
}
/** المدير مسح البيانات: نشيل أي حاجة اتعملت قبل كده من الموبايل */
function purgeBefore(t) {
  if (!t || (S.resetSeen || 0) >= t) return;
  var n = 0;
  S.order = S.order.filter(function (id) { var r = S.reports[id]; if (!r || (r.created || 0) < t) { delete S.reports[id]; n++; return false; } return true; });
  S.disp = S.disp.filter(function (d) { return (d.ts || 0) >= t; }); S.dispToday = []; S.prod = (S.prod || []).filter(function (d) { return (d.ts || 0) >= t; }); S.prodToday = []; S.siloQ = (S.siloQ || []).filter(function (d) { return (d.ts || 0) >= t; }); S.siloSt = [];
  S.resetSeen = t; save();
  if (cur && !S.reports[cur.id]) { cur = null; view = 'home'; }
  if (n) toast('🧹 اتمسحت الصبات القديمة'); render();
}
var syncing = false;
function syncAll(force) {
  setNet();
  if (syncing || !navigator.onLine || !S.api || !S.code) return;
  if (S.role === 'sup') { if ((S.prod || []).some(function (d) { return !d.synced; }) || force) syncProd(false); if ((S.siloQ || []).some(function (d) { return !d.synced; })) syncSilo(false); return syncDispatch(force); }
  var ids = S.order.filter(function (id) {
    var r = S.reports[id]; if (!r || r.closedSynced || r.handedTo) return false;
    if (!r.sid && !(r.data.rows || []).length && !(r.data.events || []).length && !r.final) return false;
    var stale = Date.now() - (r.lastPing || 0) > 3 * 60000; // نبعت كل 3 دقايق للتنبيهات اللحظية
    return r.updatedAt > (r.syncedAt || 0) || (force && !r.final) || (!r.final && stale);
  });
  // صبة فاضية لسه مش بتتسجل، بس نجيبلها العربيات الجاية
  S.order.forEach(function (id) {
    var r = S.reports[id];
    if (!r || r.final || r.handedTo || !r.data.header.client || ids.indexOf(id) >= 0) return;
    if (!force && Date.now() - Math.max(r.lastIncoming || 0, r.lastPing || 0) < 60000) return;
    r.lastIncoming = Date.now();
    api({ action: 'incoming', code: S.code, client: r.data.header.client, site: r.data.header.site, since: r.created || 0 }).then(function (res) {
      if (res && res.ok) { r.incoming = res.incoming || []; notifyNew(r); save(); if (view === 'rep' && cur === r) renderReport(); }
    }).catch(function () {});
  });
  if (!ids.length) return;
  syncing = true;
  var i = 0;
  (function next() {
    if (i >= ids.length) {
      syncing = false; save(); setNet(); if (view === 'rep' || view === 'home') render();
      var more = S.order.some(function (id) { var x = S.reports[id]; return x && !x.closedSynced && !x.handedTo && x.updatedAt > (x.syncedAt || 0); });
      if (more) setTimeout(function () { syncAll(false); }, 300);
      return;
    }
    var r = S.reports[ids[i++]], sentAt = r.updatedAt;
    var body = { action: 'sync', code: S.code, report: { id: r.id, created: r.created || 0, data: r.data, final: !!r.final } };
    if (r.final && r.signature) body.signature = r.signature;
    api(body).then(function (res) {
      if (res && res.ok) {
        r.syncedAt = sentAt; r.lastPing = Date.now(); r.sid = res.sid;
        if (r.final && res.final) { r.closedSynced = true; delete r.signature; }
        liveMsgs[r.id] = res.live || [];
        if (res.clients) S.clients = res.clients; if (res.sites) S.sites = res.sites; if (res.lists) S.lists = res.lists;
        r.incoming = res.incoming || []; notifyNew(r);
      } else if (res && res.handedOver && !sameName(res.owner, S.name)) { r.handedTo = res.owner; save(); toast('🔁 الصبة دي اتسلمت لـ ' + res.owner); }
      else if (res && res.auth === false) { toast('❌ الكود اتوقف — كلم المدير'); }
      else toast('⚠️ ' + ((res && res.error) || 'مشكلة في الإرسال'));
      next();
    }).catch(function () { syncing = false; setNet(); });
  })();
}
window.addEventListener('online', function () { setNet(); syncAll(true); });
window.addEventListener('offline', setNet);
setInterval(function () { syncAll(false); if (view === 'rep') renderAlerts(); }, 60000);

var tSave;
function touch() { if (!cur) return; cur.updatedAt = Date.now(); save(); setNet(); clearTimeout(tSave); tSave = setTimeout(function () { syncAll(false); }, 2500); }

// ===================== الشاشات =====================
function render() {
  document.getElementById('who').textContent = S.name ? (S.mgr ? '👔 المدير: ' : S.role === 'sup' ? 'المشرف: ' : 'الفني: ') + S.name : '';
  setNet();
  if (!S.api) return renderNoApi();
  if (!S.code) return renderLogin();
  if (S.role === 'sup' && cur && cur.mgrSid) {
    if (view === 'rep') return renderReport(); if (view === 'head') return renderHeader();
    if (view === 'left' && leftForm) return renderLeft(); if (view === 'move' && moveForm) return renderMove(); if (view === 'pump' && pumpForm) return renderPump();
  }
  if (S.mgr && view === 'act') return renderAct();
  if (S.mgr && view === 'mdisp') return renderMDisp();
  if (S.role === 'sup') { if (view === 'prod') return renderProd(); if (view === 'silo') return renderSilo(); if (view === 'rep13') return renderProdRep(); if (view === 'pours' || view === 'pour') view = 'home'; return renderSup(); }
  if (view === 'rep' && cur) return renderReport();
  if (view === 'head' && cur) return renderHeader();
  if (view === 'left' && cur && leftForm) return renderLeft();
  if (view === 'move' && cur && moveForm) return renderMove();
  if (view === 'pump' && cur && pumpForm) return renderPump();
  renderHome();
}
function renderNoApi() {
  document.getElementById('app').innerHTML = '<div class="card center"><h3 style="justify-content:center">⚠️ التطبيق مش متوصل بالسيرفر</h3><p>افتح التطبيق من <b>اللينك اللي بعته المدير</b> (مش من البحث).</p>' +
    '<p class="muted">أو انسخ اللينك اللي المدير بعته والصقه هنا:</p><input id="apiLink" placeholder="الصق اللينك هنا" dir="ltr" style="text-align:left"><div style="height:8px"></div><button class="btn big" onclick="setApiLink()">🔗 اتصال</button></div>';
  // لو فيه config.json على الموقع فيه لينك السيرفر، نستخدمه لوحده
  fetch('config.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (c) { if (c && /^https:\/\/script\.google/.test(c.api || '') && !S.api) { S.api = c.api; save(); render(); } }).catch(function () {});
}
function setApiLink() {
  var v = (document.getElementById('apiLink').value || '').trim(), m = /[?&]api=([^&\s]+)/.exec(v);
  if (m) v = decodeURIComponent(m[1]);
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)) return toast('⚠️ اللينك ده مش صح — انسخ اللينك اللي المدير بعته كله');
  S.api = v; save(); toast('✅ اتوصل'); render();
}
function renderLogin() {
  document.getElementById('app').innerHTML = '<div class="card"><h3>🔑 دخول الفني</h3><label>الكود اللي إداهولك المدير</label><input id="code" inputmode="numeric" autocomplete="off"><div style="height:10px"></div><button class="btn big" onclick="login()">دخول</button><p class="muted">أول مرة بس محتاج نت. بعد كده التطبيق بيشتغل من غير نت.</p></div>';
}
function login() {
  var c = document.getElementById('code').value.trim();
  if (!c) return;
  if (!navigator.onLine) return toast('محتاج نت أول مرة بس');
  toast('⏳ بيتأكد…');
  api({ action: 'login', code: c }).then(function (r) {
    if (!r.ok) return toast('❌ ' + (r.error || 'الكود غلط'));
    S.code = c; S.name = r.name; S.role = r.role || 'tech'; S.mgr = !!r.mgr; S.clients = r.clients || []; S.sites = r.sites || {}; if (r.lists) S.lists = r.lists; if (r.silos) S.siloSt = r.silos; if (r.admix) S.admix = r.admix; if (r.admTypes) S.admTypes = r.admTypes; if (r.mixes) S.mixes = r.mixes; if (r.siloWarn) S.siloWarn = r.siloWarn; save(); render(); syncAll(true); restoreMine(true);
  }).catch(function () { toast('❌ مقدرتش أوصل للسيرفر'); });
}
/** عربية جديدة خرجت للفني: صوت/اهتزاز + إشعار على الموبايل */
/** العربية دي الفني كتبها بإيده قبل كده (مثلاً وهو من غير نت)؟ نفس الرقم + وقت خروج قريب */
function tkey(t) { return String(t || '').toUpperCase().replace(/[\s\-_.]/g, '').replace(/^T(?=\d)/, ''); }
function hm2m(t) { var m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }
function typedAlready(rows, x) {
  var xe = hm2m(x.exit);
  return (rows || []).some(function (r) {
    if (r.dispatch_id || r.diverted || tkey(r.truck) !== tkey(x.truck)) return false;
    var re = hm2m(r.exit), ra = hm2m(r.arrival || r.start);
    if (re !== null && xe !== null && Math.abs(re - xe) <= 15) return true;
    if (ra !== null && xe !== null) return (ra - xe + 1440) % 1440 <= 360;
    return false;
  });
}
function notifyNew(r) {
  r.seenInc = r.seenInc || {};
  var first = !r.incInit; r.incInit = 1;
  (r.incoming || []).forEach(function (x) {
    if (r.seenInc[x.id]) return; r.seenInc[x.id] = 1;
    if (typedAlready(r.data.rows, x)) return;
    if (first || x.broken) return;
    var msg = 'عربية ' + (x.truck || '') + ' خرجت ' + (x.exit || '') + ' لـ ' + (r.data.header.client || '') + ' — ' + (x.qty_m3 || '') + ' م³' + (x.grade ? ' ' + x.grade : '');
    toast('🚚 ' + msg);
    try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
    try {
      if (window.Notification && Notification.permission === 'granted' && navigator.serviceWorker)
        navigator.serviceWorker.ready.then(function (reg) { reg.showNotification('🚚 عربية جاية', { body: msg, tag: x.id, renotify: true, vibrate: [400, 150, 400], icon: 'icon-192.png', lang: 'ar', dir: 'rtl' }); });
    } catch (e) {}
  });
}
function askNotif() {
  if (!window.Notification) return toast('الموبايل ده مش بيدعم الإشعارات من المتصفح');
  Notification.requestPermission().then(function (p) { toast(p === 'granted' ? '✅ الإشعارات اشتغلت' : '❌ الإشعارات اترفضت — فعّلها من إعدادات المتصفح'); render(); });
}
function renderHome() {
  var h = '<div style="padding:10px" class="g2"><button class="btn g big" onclick="newReport()">➕ صبة جديدة</button><button class="btn big" onclick="showOpen()">🔁 استلام صبة شغالة</button></div>' +
    (window.Notification && Notification.permission === 'default' ? '<div style="padding:0 10px 8px"><button class="btn l" style="width:100%" onclick="askNotif()">🔔 فعّل إشعار العربيات الجاية</button></div>' : '');
  var items = S.order.slice().reverse().map(function (id) {
    var r = S.reports[id]; if (!r) return '';
    var hd = r.data.header || {}, n = (r.data.rows || []).length;
    if (r.handedTo && sameName(r.handedTo, S.name)) { delete r.handedTo; save(); }
    var st = r.handedTo ? '<span class="st s">🔁 اتسلمت لـ ' + esc(r.handedTo) + '</span>' : r.closedSynced ? '<span class="st f">✅ خلصت واتبعتت</span>' : r.final ? '<span class="st p">⏳ خلصت — مستنية نت</span>' :
      (!n && !r.sid ? '<span class="st s">📝 لسه فاضية</span>' : (hd.date && hd.date < today() && n) ? '<span class="st p" style="background:#fdecea;color:#c0392b">📅 من يوم فات — اقفلها</span>' : r.updatedAt > (r.syncedAt || 0) ? '<span class="st p">⏳ شغالة — مستنية نت</span>' : '<span class="st s">🟢 شغالة</span>');
    var canDel = !r.final && !r.closedSynced && !r.handedTo && !n;
    return '<div class="it" onclick="openRep(\'' + id + '\')"><div><b>' + esc(hd.client || 'بدون عميل') + (hd.site ? ' — ' + esc(hd.site) : '') + '</b><br><span class="muted">' + esc(hd.element || '') + ' · ' + esc(hd.date) + ' · ' + n + ' عربية</span></div>' +
      '<div style="display:flex;gap:6px;align-items:center">' + st + (canDel ? '<button class="mini del" onclick="event.stopPropagation();delReport(\'' + id + '\')">🗑</button>' : '') + '</div></div>';
  }).join('');
  h += '<div class="card list" style="padding:0">' + (items || '<p class="center muted" style="padding:20px">مفيش صبات لسه</p>') + '</div>';
  h += '<div style="padding:10px" class="g2"><button class="btn l" onclick="refreshLists()">🔄 تحديث</button><button class="btn l" onclick="cleanup()">🧹 مسح القديم</button></div>';
  h += '<p class="center muted"><a href="#" onclick="logout();return false">خروج</a></p>';
  document.getElementById('app').innerHTML = h;
}
function refreshLists() {
  if (!navigator.onLine) return toast('مفيش نت');
  toast('⏳ بيحدّث…');
  api({ action: 'login', code: S.code }).then(function (r) { if (r.ok) { S.clients = r.clients || []; S.sites = r.sites || {}; if (r.lists) S.lists = r.lists; if (r.silos) S.siloSt = r.silos; if (r.admix) S.admix = r.admix; if (r.admTypes) S.admTypes = r.admTypes; if (r.mixes) S.mixes = r.mixes; save(); toast('✅ القوايم اتحدثت'); } }).catch(function () {});
  syncAll(true); restoreMine(false);
}
/** الفني دخل من موبايل تاني: نرجّعله صباته الشغالة من السيرفر */
function restoreMine(announce) {
  if (S.role === 'sup' || !navigator.onLine) return;

function fixT(v) {
  var d = String(v || '').replace(/[٠-٩]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(c); }).replace(/[^\d:]/g, '');
  if (!d) return '';
  var mm = d.match(/^(\d{1,2}):(\d{2})$/), m;
  d = d.replace(/:/g, '');
  if (mm) m = mm; else if (d.length <= 2) m = [0, d, '0']; else if (d.length <= 4) m = [0, d.slice(0, d.length - 2), d.slice(-2)]; else return null;
  var h = +m[1], mi = +m[2]; if (h > 23 || mi > 59) return null;
  return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
}

}, true);

/* ترتيب العربيات بوقت الوصول (بيعدّي 12 بالليل صح)؛ الأحداث (نقل مضخة/تسليم/…) بتفضل بعد نفس العربية */
function sortRows(d) {
  var rows = d.rows || []; if (rows.length < 2) return false;
  var ref = null; rows.forEach(function (r) { if (ref === null) ref = hm2m(r.arrival) != null ? hm2m(r.arrival) : hm2m(r.exit); });
  function key(r) { var m = hm2m(r.arrival); if (m == null) return Infinity; if (ref != null && m < ref - 360) m += 1440; return m; }
  var a = rows.map(function (r, i) { return { r: r, i: i, k: key(r) }; });
  a.sort(function (x, y) { return x.k - y.k || x.i - y.i; });
  if (a.every(function (x, j) { return x.i === j; })) return false;
  var ni = {}; a.forEach(function (x, j) { ni[x.i] = j; });
  (d.events || []).forEach(function (e) { if (e.after_row && ni[e.after_row - 1] != null) e.after_row = ni[e.after_row - 1] + 1; });
  d.rows = a.map(function (x) { return x.r; });
  return true;
}

function saveSiloForm() {

  if (f.notech) {
    var m = f.method || 'مزراب';
    h += '<div class="g2" style="margin-top:6px"><div><label>طريقة الصب</label><select onchange="sf(\'method\',this.value);renderSupForm()"><option' + (m === 'مزراب' ? ' selected' : '') + '>مزراب</option><option' + (m === 'مضخة' ? ' selected' : '') + '>مضخة</option></select></div>' +
      (m === 'مضخة' ? supSel('pump', 'المضخة', L('pumps')) : '<div></div>') + '</div><p class="muted" style="margin:4px 0">العربية دي مش هتظهر لأي فني ومش هيتعملها سايت شيت.</p>';
  }
  return h + '</div>';
}
function setMode(v) {
  supForm.notech = v; if (v) { supForm.method = supForm.method || 'مزراب'; supForm.site_tech = ''; }
  S.modeMem = S.modeMem || {}; if (supForm.client) S.modeMem[supForm.client + '|' + (supForm.site || '')] = { notech: v, method: supForm.method, pump: supForm.pump };
  var y = window.scrollY; renderSupForm(); window.scrollTo(0, y);
}
function supSel(k, lab, opts) {
  var v = supForm[k] == null ? '' : String(supForm[k]), o = opts.slice(); if (v && o.indexOf(v) < 0) o.unshift(v);
  return '<div><label>' + lab + '</label><select data-lab="' + esc(lab) + '" onchange="supPick(\'' + k + '\',this)"><option value="">— اختار —</option>' +
    o.map(function (x) { return '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '<option value="__o">✏️ حاجة مش في القايمة…</option></select></div>';
}
function supPick(k, el) {
  var v = el.value;
  if (v === '__o') { v = prompt(el.getAttribute('data-lab') || ''); if (v === null) return renderSupForm(); v = v.trim(); }
  supForm[k] = v; if (k === 'grade') admAuto(supForm, true);
  if (k === 'truck') { var dl = lastDriver(v); if (dl) supForm.driver = dl; }
  var y = window.scrollY; renderSupForm(); window.scrollTo(0, y);
}
function saveDispatch() {
  var f = supForm;
  if (!f.client || !f.truck) return toast('اختار العميل واكتب رقم العربية');
  f.qty_m3 = Number(String(f.qty_m3).replace(',', '.')) || f.qty_m3;
  if (f.samples !== '' && f.samples != null) f.samples = Number(String(f.samples).replace(/[^0-9]/g, '')) || f.samples;
  if (f.exit_slump !== '' && f.exit_slump != null) f.exit_slump = Number(String(f.exit_slump).replace(',', '.')) || f.exit_slump;
  if (f.sadm_l !== '' && f.sadm_l != null) f.sadm_l = Number(String(f.sadm_l).replace(',', '.')) || '';
  if (f.sadm_l && !f.sadm_t) return toast('اختار نوع إضافة الموقع');
  if (f.notech && f.method === 'مضخة' && !f.pump) return toast('اختار المضخة');
  if (f.client) { S.modeMem = S.modeMem || {}; S.modeMem[f.client + '|' + (f.site || '')] = { notech: !!f.notech, method: f.method, pump: f.pump }; }
  f.synced = false;
  var i = S.disp.map(function (x) { return x.id; }).indexOf(f.id);
  if (i >= 0) S.disp[i] = f; else S.disp.push(f);
  S.disp = S.disp.filter(function (d) { return Date.now() - d.ts < 3 * 86400000 || !d.synced; });
  save(); supForm = null; render(); syncAll(true);
  toast(navigator.onLine ? '✅ اتبعتت' : '📴 اتحفظت — هتتبعت أول ما النت يرجع');
}
function markBroken() {
  var n = prompt('إيه اللي حصل؟ (عطل / غرزت / مكانها فين)');
  if (n === null) return;
  supForm.breakdown = n.trim() || 'عطلت/غرزت'; saveDispatch();
}
function cancelDispatch() { if (!confirm('تلغي العربية دي؟')) return; supForm.cancelled = true; saveDispatch(); }

// ===================== الإمضاء والإنهاء =====================
var cv, cx, drawing = false, hasInk = false;
function openSig() {
  var d = cur.data;
  if (!d.rows.length) return toast('مفيش عربيات');
  var open = d.rows.filter(function (r) { return !r.diverted && !r.end; }).length;
  if (open && !confirm(open + ' عربية لسه ملهاش وقت نهاية. تكمّل الإنهاء؟')) return;
  var f = d.footer = d.footer || {};
  var needP = d.events.length || d.rows.some(function (r) { return r.diverted; });
  document.getElementById('sigFoot').innerHTML = '<div class="alert y" style="margin:8px 0">املا آخر الشيت قبل الإمضاء — بعد الإنهاء مش هينفع يتعدل.</div><div class="g2">' +
    '<div><label>استخدام الهزاز *</label><select id="fVib" data-p="footer.vibrator" onchange="setP(this)">' +
    [['', '— اختار —'], ['done', 'تم'], ['not_done', 'لم يتم'], ['poor', 'ليس بصورة جيدة'], ['other', 'أخرى']].map(function (o) { return '<option value="' + o[0] + '"' + ((f.vibrator || '') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
    fld('footer.returned_concrete', 'خرسانة راجعة (م³)', f.returned_concrete, 'inputmode="decimal"') + fld('footer.waste_estimate', 'الهالك التقديري', f.waste_estimate) + '</div>' +
    '<div style="margin-top:6px"><label>أي مشاكل حدثت بالموقع أثناء الصب' + (needP ? ' * (فيه أحداث)' : '') + '</label><textarea id="fProb" rows="2" data-p="footer.problems_text" oninput="setP(this)">' + esc(f.problems_text) + '</textarea></div>';
  document.getElementById('sigWrap').style.display = 'flex';
  document.getElementById('sigWho').textContent = 'الفني: ' + S.name + ' — امضي وبعدين «إنهاء وإرسال»';
  cv = document.getElementById('sig'); cx = cv.getContext('2d'); sigClear();
}
function sigClose() { document.getElementById('sigWrap').style.display = 'none'; if (cur && view === 'rep') renderReport(); }
function sigClear() { cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.lineWidth = 6; cx.lineCap = 'round'; cx.strokeStyle = '#0b3d91'; hasInk = false; }
function pos(ev) { var r = cv.getBoundingClientRect(), t = ev.touches ? ev.touches[0] : ev; return [(t.clientX - r.left) * cv.width / r.width, (t.clientY - r.top) * cv.height / r.height]; }
function sigInit() {
  var c = document.getElementById('sig');
  function down(e) { e.preventDefault(); drawing = true; var p = pos(e); cx.beginPath(); cx.moveTo(p[0], p[1]); }
  function move(e) { if (!drawing) return; e.preventDefault(); var p = pos(e); cx.lineTo(p[0], p[1]); cx.stroke(); hasInk = true; }
  function up() { drawing = false; }
  c.addEventListener('mousedown', down); c.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  c.addEventListener('touchstart', down, { passive: false }); c.addEventListener('touchmove', move, { passive: false }); c.addEventListener('touchend', up);
}
/* اليوم من 12 بالليل لـ 12 بالليل: صبة امبارح بتتقفل، وصبة جديدة بتتفتح بنفس البيانات */
var rollTo = null;
/* صبة من يوم فات = اتفتحت قبل 12 بالليل، وواقفة من 4 ساعات أو أكتر، ومفيش عربية في نص الصب.
   الصبة اللي بدأت 9 بالليل وشغالة لحد بعد 12 بتكمل عادي على نفس الشيت. */
function isOldDay(r) {
  if (r && r.mgrSid) return false;
  if (!(r && !r.final && !r.handedTo && r.data.header.date && r.data.header.date < today() && (r.data.rows || []).length)) return false;
  if ((r.data.rows || []).some(function (x) { return !x.diverted && x.arrival && !x.end; })) return false;
  return Date.now() - (r.updatedAt || 0) > 4 * 3600000;
}
function askRoll() {
  if (!confirm('📅 اليوم اتغير — الصبة دي بتاريخ ' + cur.data.header.date + '.\n\nهنقفل صبة امبارح (تمضي عليها دلوقتي) ونفتح صبة النهارده لنفس العميل والموقع والمضخة.\n\nموافق؟')) return;
  var h = JSON.parse(JSON.stringify(cur.data.header)), id = uid(), now = Date.now();
  h.date = today(); h.technician = S.name; delete h.qty_required_m3;
  var g = gradeAt(Math.max(0, cur.data.rows.length - 1)); if (g.gs) h.grade_strength = g.gs; if (g.cc) h.cement_content = g.cc;
  cur.data.events.forEach(function (e) { if ((e.type === 'pump_move' || e.type === 'element_move') && e.element && !e.client) h.element = e.element; });
  S.reports[id] = { id: id, created: now, updatedAt: now, data: { header: h, rows: [], events: [{ type: 'other', type_ar: 'ملاحظة', from: null, to: null, after_row: null, text: 'تكملة صبة ' + cur.data.header.date + ' (اليوم الجديد من 12 بالليل)' }], footer: {} } };
  S.order.push(id); save(); rollTo = id;
  openSig();
}
function finish() {
  var d = cur.data, f = d.footer || {};
  if (!f.vibrator) { toast('اختار «استخدام الهزاز»'); document.getElementById('fVib').focus(); return; }
  if ((d.events.length || d.rows.some(function (r) { return r.diverted; })) && !String(f.problems_text || '').trim()) { toast('فيه أحداث (نقل مضخة / وقفة / عربية اتحولت) — اكتب المشاكل'); document.getElementById('fProb').focus(); return; }
  if (!hasInk && !confirm('مفيش إمضاء. تكمّل من غير إمضاء؟')) return;
  cur.data.header.technician = cur.data.header.technician || S.name;
  cur.data.closed = true;
  if (hasInk) { var small = document.createElement('canvas'); small.width = 500; small.height = 200; small.getContext('2d').drawImage(cv, 0, 0, 500, 200); cur.signature = small.toDataURL('image/png'); }
  cur.final = true; touch(); sigClose();
  if (rollTo && S.reports[rollTo]) { cur = S.reports[rollTo]; rollTo = null; view = 'rep'; toast('✅ صبة امبارح اتقفلت — كمّل هنا'); }
  renderReport(); window.scrollTo(0, 0); syncAll(true);
  toast(navigator.onLine ? '⏳ بيتبعت…' : '📴 اتحفظ — هيتبعت أول ما النت يرجع');
}

// ===================== حجم الخط =====================
var ZOOMS = [1, 1.15, 1.3, 1.5];
function applyZoom() { var z = ZOOMS[S.zoom || 0]; document.body.style.zoom = ''; document.documentElement.style.setProperty('--z', z); document.body.classList.toggle('zbig', z > 1.1); }
function zoomUp() { S.zoom = ((S.zoom || 0) + 1) % ZOOMS.length; save(); applyZoom(); toast('حجم الخط: ' + Math.round(ZOOMS[S.zoom] * 100) + '%'); }

// ===================== تشغيل =====================
applyZoom();
sigInit();
render();
syncAll(true);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
