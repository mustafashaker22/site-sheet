<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>سايت شيت — جودة إيجي مكس</title>
<style>
:root{color-scheme:light only;--b:#1f4e78;--g:#1f7a3a;--r:#c0392b;--y:#e0a800;--bg:#eef1f4}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#222;font-size:calc(17px * var(--z,1));padding-bottom:90px;-webkit-text-size-adjust:100%}
header{background:var(--b);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}
header small{opacity:.85}
.net{font-size:12px;padding:3px 8px;border-radius:10px;background:#ffffff22}
.card{background:#fff;margin:10px;padding:12px;border-radius:12px;box-shadow:0 1px 3px #0002}
.card h3{margin:0 0 8px;font-size:calc(16px * var(--z,1));display:flex;justify-content:space-between;align-items:center;gap:6px}
label{font-size:calc(14px * var(--z,1));color:#666;display:block;margin-bottom:2px}
input,select,textarea{width:100%;font-size:calc(18px * var(--z,1));padding:10px 7px;border:1px solid #bbb;border-radius:8px;background:#fff;font-family:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{font-family:inherit;font-size:calc(17px * var(--z,1));border:0;border-radius:10px;padding:11px;cursor:pointer}
.btn{background:var(--b);color:#fff;width:100%}
.btn.g{background:var(--g)}.btn.r{background:var(--r)}.btn.l{background:#e8edf3;color:#1f4e78}
.big{font-size:calc(18px * var(--z,1));padding:15px}
.now{background:#e6f3ea;color:var(--g);font-weight:bold;width:100%;padding:12px 4px;font-size:calc(15px * var(--z,1))}
.tm input{text-align:center;font-weight:bold;color:var(--b)}
.tm label{text-align:center}
.mini{font-size:calc(13px * var(--z,1));padding:6px 10px;width:auto}
.del{background:#fde2e2;color:var(--r)}
.row{display:flex;gap:8px;align-items:center}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.st{font-size:calc(14px * var(--z,1));padding:3px 8px;border-radius:10px;white-space:nowrap}
.st.p{background:#fff3cd;color:#8a6d00}.st.s{background:#e3f0ff;color:#1f4e78}.st.f{background:#e6f3ea;color:var(--g)}
.alert{margin:10px;padding:10px;border-radius:10px;font-size:14px;line-height:1.7}
.alert.r{background:#fde2e2;border-right:5px solid var(--r)}.alert.y{background:#fff3cd;border-right:5px solid var(--y)}
.badge{font-size:calc(12px * var(--z,1));padding:2px 8px;border-radius:10px;background:#fde2e2;color:var(--r);font-weight:bold}
.badge.y{background:#fff3cd;color:#8a6d00}.badge.g{background:#e6f3ea;color:var(--g)}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;box-shadow:0 -2px 8px #0002;display:flex;gap:8px;z-index:6}
.muted{color:#666;font-size:calc(15px * var(--z,1))}
.ev{border-right:4px solid var(--y)}
.done{opacity:.75}
#sigWrap{position:fixed;inset:0;background:#000a;display:none;z-index:20;align-items:center;justify-content:center}
#sigBox{background:#fff;border-radius:12px;padding:12px;width:94%;max-width:520px}
#sig{width:100%;height:200px;border:2px dashed #999;border-radius:8px;touch-action:none;background:#fff}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;display:none}
.center{text-align:center}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}.chk input{width:auto}
body.zbig .g4{grid-template-columns:repeat(2,1fr)}
body.zbig .g3{grid-template-columns:repeat(2,1fr)}
</style>
</head>
<body>
<header><div><b>📋 سايت شيت</b><br><small id="who"></small></div><div style="display:flex;gap:6px;align-items:center"><button onclick="zoomUp()" style="background:#ffffff22;color:#fff;padding:5px 10px;font-size:15px">🔍 الخط</button><span class="net" id="net">…</span></div></header>
<div id="app"></div>
<div id="sigWrap"><div id="sigBox">
  <h3 style="margin:4px 0 8px">✍️ إمضاء الفني</h3>
  <div class="muted" id="sigWho"></div>
  <label style="margin-top:8px">امضي هنا بصباعك</label>
  <canvas id="sig" width="1000" height="400"></canvas>
  <div class="g3" style="margin-top:8px"><button class="btn l" onclick="sigClear()">مسح</button><button class="btn l" onclick="sigClose()">رجوع</button><button class="btn g" onclick="finish()">✅ إنهاء وإرسال</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
// ===================== التخزين =====================
var KEY = 'qc_site_app_v1';
var S = load();
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ الذاكرة مليانة'); } }
S.reports = S.reports || {}; S.order = S.order || []; S.clients = S.clients || []; S.sites = S.sites || {}; S.disp = S.disp || []; S.dispToday = S.dispToday || [];
var qs = new URLSearchParams(location.search);
if (qs.get('api')) { S.api = qs.get('api'); save(); history.replaceState(null, '', location.pathname); }

var cur = null;   // التقرير المفتوح
var view = 'home';
var liveMsgs = {};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function esc(v) { return v == null ? '' : String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 2500); }
function mins(hm) { if (!hm) return null; var p = hm.split(':'); return (+p[0]) * 60 + (+p[1]); }
function since(hm) { var m = mins(hm); if (m == null) return null; var n = mins(nowHM()); return (n - m + 1440) % 1440; }

// ===================== الشبكة والمزامنة =====================
function setNet() {
  var pend = S.order.filter(function (id) { var r = S.reports[id]; return r && !r.closedSynced && !r.handedTo && ((r.data.rows || []).length || r.sid) && r.updatedAt > (r.syncedAt || 0); }).length + S.disp.filter(function (d) { return !d.synced; }).length;
  document.getElementById('net').textContent = (navigator.onLine ? '🟢 متصل' : '🔴 من غير نت') + (pend ? ' · ⏳ ' + pend : '');
}
function api(body) {
  return fetch(S.api, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); }).then(function (res) {
    if (res && res.resetAt) purgeBefore(res.resetAt);
    return res;
  });
}
/** المدير مسح البيانات: نشيل أي حاجة اتعملت قبل كده من الموبايل */
function purgeBefore(t) {
  if (!t || (S.resetSeen || 0) >= t) return;
  var n = 0;
  S.order = S.order.filter(function (id) { var r = S.reports[id]; if (!r || (r.created || 0) < t) { delete S.reports[id]; n++; return false; } return true; });
  S.disp = S.disp.filter(function (d) { return (d.ts || 0) >= t; }); S.dispToday = [];
  S.resetSeen = t; save();
  if (cur && !S.reports[cur.id]) { cur = null; view = 'home'; }
  if (n) toast('🧹 اتمسحت الصبات القديمة'); render();
}
var syncing = false;
function syncAll(force) {
  setNet();
  if (syncing || !navigator.onLine || !S.api || !S.code) return;
  if (S.role === 'sup') return syncDispatch(force);
  var ids = S.order.filter(function (id) {
    var r = S.reports[id]; if (!r || r.closedSynced || r.handedTo) return false;
    if (!r.sid && !(r.data.rows || []).length && !(r.data.events || []).length && !r.final) return false;
    var stale = Date.now() - (r.lastPing || 0) > 3 * 60000; // نبعت كل 3 دقايق للتنبيهات اللحظية
    return r.updatedAt > (r.syncedAt || 0) || (force && !r.final) || (!r.final && stale);
  });
  // صبة فاضية لسه مش بتتسجل، بس نجيبلها العربيات الجاية
  S.order.forEach(function (id) {
    var r = S.reports[id];
    if (!r || r.sid || r.final || r.handedTo || (r.data.rows || []).length || !r.data.header.client) return;
    if (!force && Date.now() - (r.lastIncoming || 0) < 60000) return;
    r.lastIncoming = Date.now();
    api({ action: 'incoming', code: S.code, client: r.data.header.client, site: r.data.header.site }).then(function (res) {
      if (res && res.ok) { r.incoming = res.incoming || []; save(); if (view === 'rep' && cur === r) renderReport(); }
    }).catch(function () {});
  });
  if (!ids.length) return;
  syncing = true;
  var i = 0;
  (function next() {
    if (i >= ids.length) {
      syncing = false; save(); setNet(); if (view === 'rep' || view === 'home') render();
      var more = S.order.some(function (id) { var x = S.reports[id]; return x && !x.closedSynced && !x.handedTo && x.updatedAt > (x.syncedAt || 0); });
      if (more) setTimeout(function () { syncAll(false); }, 300);
      return;
    }
    var r = S.reports[ids[i++]], sentAt = r.updatedAt;
    var body = { action: 'sync', code: S.code, report: { id: r.id, created: r.created || 0, data: r.data, final: !!r.final } };
    if (r.final && r.signature) body.signature = r.signature;
    api(body).then(function (res) {
      if (res && res.ok) {
        r.syncedAt = sentAt; r.lastPing = Date.now(); r.sid = res.sid;
        if (r.final && res.final) { r.closedSynced = true; delete r.signature; }
        liveMsgs[r.id] = res.live || [];
        if (res.clients) S.clients = res.clients; if (res.sites) S.sites = res.sites;
        r.incoming = res.incoming || [];
      } else if (res && res.handedOver) { r.handedTo = res.owner; save(); toast('🔁 الصبة دي اتسلمت لـ ' + res.owner); }
      else if (res && res.auth === false) { toast('❌ الكود اتوقف — كلم المدير'); }
      else toast('⚠️ ' + ((res && res.error) || 'مشكلة في الإرسال'));
      next();
    }).catch(function () { syncing = false; setNet(); });
  })();
}
window.addEventListener('online', function () { setNet(); syncAll(true); });
window.addEventListener('offline', setNet);
setInterval(function () { syncAll(false); if (view === 'rep') renderAlerts(); }, 60000);

var tSave;
function touch() { if (!cur) return; cur.updatedAt = Date.now(); save(); setNet(); clearTimeout(tSave); tSave = setTimeout(function () { syncAll(false); }, 2500); }

// ===================== الشاشات =====================
function render() {
  document.getElementById('who').textContent = S.name ? (S.role === 'sup' ? 'المشرف: ' : 'الفني: ') + S.name : '';
  setNet();
  if (!S.api) return renderNoApi();
  if (!S.code) return renderLogin();
  if (S.role === 'sup') { if (view === 'pours' || view === 'pour') view = 'home'; return renderSup(); }
  if (view === 'rep' && cur) return renderReport();
  if (view === 'head' && cur) return renderHeader();
  if (view === 'left' && cur && leftForm) return renderLeft();
  if (view === 'move' && cur && moveForm) return renderMove();
  renderHome();
}
function renderNoApi() {
  document.getElementById('app').innerHTML = '<div class="card center"><h3 style="justify-content:center">⚠️ التطبيق مش متوصل بالسيرفر</h3><p>افتح التطبيق من <b>اللينك اللي بعته المدير</b> (مش من البحث).</p></div>';
}
function renderLogin() {
  document.getElementById('app').innerHTML = '<div class="card"><h3>🔑 دخول الفني</h3><label>الكود اللي إداهولك المدير</label><input id="code" inputmode="numeric" autocomplete="off"><div style="height:10px"></div><button class="btn big" onclick="login()">دخول</button><p class="muted">أول مرة بس محتاج نت. بعد كده التطبيق بيشتغل من غير نت.</p></div>';
}
function login() {
  var c = document.getElementById('code').value.trim();
  if (!c) return;
  if (!navigator.onLine) return toast('محتاج نت أول مرة بس');
  toast('⏳ بيتأكد…');
  api({ action: 'login', code: c }).then(function (r) {
    if (!r.ok) return toast('❌ ' + (r.error || 'الكود غلط'));
    S.code = c; S.name = r.name; S.role = r.role || 'tech'; S.clients = r.clients || []; S.sites = r.sites || {}; save(); render(); syncAll(true); restoreMine(true);
  }).catch(function () { toast('❌ مقدرتش أوصل للسيرفر'); });
}
function renderHome() {
  var h = '<div style="padding:10px" class="g2"><button class="btn g big" onclick="newReport()">➕ صبة جديدة</button><button class="btn big" onclick="showOpen()">🔁 استلام صبة شغالة</button></div>';
  var items = S.order.slice().reverse().map(function (id) {
    var r = S.reports[id]; if (!r) return '';
    var hd = r.data.header || {}, n = (r.data.rows || []).length;
    var st = r.handedTo ? '<span class="st s">🔁 اتسلمت لـ ' + esc(r.handedTo) + '</span>' : r.closedSynced ? '<span class="st f">✅ خلصت واتبعتت</span>' : r.final ? '<span class="st p">⏳ خلصت — مستنية نت</span>' :
      (!n && !r.sid ? '<span class="st s">📝 لسه فاضية</span>' : r.updatedAt > (r.syncedAt || 0) ? '<span class="st p">⏳ شغالة — مستنية نت</span>' : '<span class="st s">🟢 شغالة</span>');
    var canDel = !r.final && !r.closedSynced && !r.handedTo && !n;
    return '<div class="it" onclick="openRep(\'' + id + '\')"><div><b>' + esc(hd.client || 'بدون عميل') + (hd.site ? ' — ' + esc(hd.site) : '') + '</b><br><span class="muted">' + esc(hd.element || '') + ' · ' + esc(hd.date) + ' · ' + n + ' عربية</span></div>' +
      '<div style="display:flex;gap:6px;align-items:center">' + st + (canDel ? '<button class="mini del" onclick="event.stopPropagation();delReport(\'' + id + '\')">🗑</button>' : '') + '</div></div>';
  }).join('');
  h += '<div class="card list" style="padding:0">' + (items || '<p class="center muted" style="padding:20px">مفيش صبات لسه</p>') + '</div>';
  h += '<div style="padding:10px" class="g2"><button class="btn l" onclick="refreshLists()">🔄 تحديث</button><button class="btn l" onclick="cleanup()">🧹 مسح القديم</button></div>';
  h += '<p class="center muted"><a href="#" onclick="logout();return false">خروج</a></p>';
  document.getElementById('app').innerHTML = h;
}
function refreshLists() {
  if (!navigator.onLine) return toast('مفيش نت');
  toast('⏳ بيحدّث…');
  api({ action: 'login', code: S.code }).then(function (r) { if (r.ok) { S.clients = r.clients || []; S.sites = r.sites || {}; save(); toast('✅ القوايم اتحدثت'); } }).catch(function () {});
  syncAll(true); restoreMine(false);
}
/** الفني دخل من موبايل تاني: نرجّعله صباته الشغالة من السيرفر */
function restoreMine(announce) {
  if (S.role === 'sup' || !navigator.onLine) return;
  api({ action: 'open', code: S.code }).then(function (r) {
    if (!r || !r.ok) return;
    var mine = (r.open || []).filter(function (o) { return o.owner === S.name && !S.reports[o.repId]; });
    if (!mine.length) return;
    var n = 0;
    (function next() {
      if (!mine.length) { save(); if (view === 'home') render(); if (n && announce !== null) toast('✅ رجعتلك ' + n + ' صبة شغالة من السيرفر'); return; }
      var o = mine.shift();
      api({ action: 'takeover', code: S.code, repId: o.repId }).then(function (t) {
        if (t && t.ok) { var now = Date.now(); S.reports[o.repId] = { id: o.repId, created: t.created || now, sid: t.sid, data: t.data, updatedAt: now, syncedAt: now, lastPing: 0 };
          if (S.order.indexOf(o.repId) < 0) S.order.push(o.repId); n++; }
        next();
      }).catch(next);
    })();
  }).catch(function () {});
}
function delReport(id) {
  var r = S.reports[id]; if (!r) return;
  if (!confirm('تمسح الصبة دي؟ (' + ((r.data.header || {}).client || 'بدون عميل') + ')')) return;
  if (r.sid && navigator.onLine) api({ action: 'discard', code: S.code, repId: id }).catch(function () {});
  delete S.reports[id]; S.order = S.order.filter(function (x) { return x !== id; }); save(); render();
}
function logout() { if (confirm('خروج؟ الصبات اللي متبعتتش هتفضل محفوظة.')) { delete S.code; save(); render(); } }
function cleanup() {
  var n = 0;
  S.order = S.order.filter(function (id) { var r = S.reports[id]; if (r && r.closedSynced && Date.now() - r.updatedAt > 3 * 86400000) { delete S.reports[id]; n++; return false; } return true; });
  save(); render(); toast(n ? 'اتمسح ' + n : 'مفيش حاجة قديمة تتمسح');
}
function newReport() {
  var id = uid();
  S.reports[id] = { id: id, created: Date.now(), updatedAt: Date.now(), data: { header: { date: today(), technician: S.name, pour_method: 'مضخة' }, rows: [], events: [], footer: {} } };
  S.order.push(id); save(); cur = S.reports[id]; view = 'head'; render();
}
function openRep(id) { cur = S.reports[id]; view = 'rep'; render(); window.scrollTo(0, 0); cur.lastPing = 0; syncAll(false); }
function goHome() { view = 'home'; cur = null; render(); }

function fld(path, lab, val, attrs) { return '<div><label>' + lab + '</label><input data-p="' + path + '" value="' + esc(val) + '" ' + (attrs || '') + ' oninput="setP(this)"></div>'; }
function setP(el) {
  var ps = el.getAttribute('data-p').split('.'), o = cur.data;
  for (var i = 0; i < ps.length - 1; i++) o = o[ps[i]];
  var k = ps[ps.length - 1], v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.getAttribute('data-n') !== null && v !== '' && typeof v === 'string') { var n = Number(v.replace(',', '.')); if (!isNaN(n)) v = n; }
  if (v === '') v = null;
  o[k] = v; touch();
}
function siteList() {
  var out = [];
  Object.keys(S.sites || {}).forEach(function (k) { (S.sites[k] || []).forEach(function (x) { if (out.indexOf(x) < 0) out.push(x); }); });
  return out;
}
/** قائمة اختيار العميل والموقع. onPick(نوع, قيمة) */
function clientSelects(client, site, fnName) {
  var cl = S.clients.slice(); if (client && cl.indexOf(client) < 0) cl.unshift(client);
  var st = siteList(); if (site && st.indexOf(site) < 0) st.unshift(site);
  var h = '<div><label>العميل</label><select onchange="' + fnName + '(\'client\',this.value)"><option value="">— اختار العميل —</option>' +
    cl.map(function (c) { return '<option' + (c === client ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
    (S.clients.length ? '' : '<div class="muted">القائمة فاضية — المدير يضيف العملاء في شيت «العملاء» ويدوس 🔄</div>') + '</div>';
  h += '<div style="margin-top:8px"><label>الموقع</label><select onchange="' + fnName + '(\'site\',this.value)"' + (st.length ? '' : ' disabled') + '>' +
    (st.length ? '<option value="">— اختار الموقع —</option>' : '<option value="">مفيش مواقع — المدير يضيفها في شيت «العملاء» عمود المواقع</option>') +
    st.map(function (x) { return '<option' + (x === site ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select></div>';
  return h;
}
function pickHead(k, v) {
  cur.data.header[k] = v || null;
  
  touch(); renderHeader();
}
function pickSup(k, v) {
  supForm[k] = v;
  
  renderSupForm();
}
function cancelNew() {
  if ((cur.data.rows || []).length) { view = 'rep'; return render(); }
  var id = cur.id; delete S.reports[id]; S.order = S.order.filter(function (x) { return x !== id; }); save(); goHome();
}
function renderHeader() {
  var h = cur.data.header;
  var opts = S.clients.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
  document.getElementById('app').innerHTML = '<div class="card"><h3>بيانات الصبة</h3>' +
    clientSelects(h.client, h.site, 'pickHead') +
    '<div class="g2" style="margin-top:8px">' + fld('header.element', 'العنصر المصبوب', h.element) +
    fld('header.grade_strength', 'الإجهاد', h.grade_strength, 'inputmode="numeric" data-n') + fld('header.cement_content', 'الأسمنت', h.cement_content, 'inputmode="numeric" data-n') +
    fld('header.qty_required_m3', 'الكمية المطلوبة م³', h.qty_required_m3, 'inputmode="decimal" data-n') + fld('header.date', 'التاريخ', h.date, 'type="date"') +

    mine.forEach(function (e) { var m = Math.min(Number(e.qty_m3) || 0, q); if (e.type === 'leftover') leftover += m; else moved.push({ el: e.element, q: m }); });
    var rest = q - leftover - moved.reduce(function (s, x) { return s + x.q; }, 0);
    if (rest < 0) rest = 0;
    parts.push({ el: curEl, q: rest });
    moved.forEach(function (x) { parts.push({ el: x.el, q: x.q }); });
    mine.forEach(function (e) { if (e.type === 'element_move' && e.element) curEl = e.element; });
    ev.forEach(function (e) { if (e.type === 'pump_move' && e.element && +e.after_row === i + 1) curEl = e.element; });
    if (r.end) { parts.forEach(function (p) { if (p.q) tot[p.el] = (tot[p.el] || 0) + p.q; }); out += leftover; }
    per.push({ parts: parts, out: leftover });
  });
  return { per: per, totals: tot, out: out };
}
function byElement() {
  var sp = splitPour(cur.data), k = Object.keys(sp.totals);
  if (k.length < 2 && !sp.out) return '';
  return '<p class="muted">' + k.map(function (x) { return esc(x) + ': <b>' + sp.totals[x] + ' م³</b>'; }).join(' · ') +
    (sp.out ? ' · راح لعميل تاني: <b>' + sp.out + ' م³</b>' : '') + '</p>';
}
function evCard(e, j, ro) {
  var dis = ro ? ' disabled' : '';
  return '<div class="card ev"><h3><span>★ ' + esc(e.type_ar) + '</span>' + (ro ? '' : '<button class="mini del" onclick="delEvent(' + j + ')">حذف</button>') + '</h3>' +
    (e.type === 'other' || e.type === 'element_move' || e.type === 'leftover' || e.type === 'breakdown' || e.type === 'handover' ? '' : '<div class="g2">' + '<div class="tm"><label>من</label><input type="time" value="' + esc(e.from) + '" onchange="cur.data.events[' + j + '].from=this.value;touch()"' + dis + '></div>' +
      (e.to ? '<div class="tm"><label>إلى</label><input type="time" value="' + esc(e.to) + '" onchange="cur.data.events[' + j + '].to=this.value;touch()"' + dis + '></div>' :
        '<div class="tm"><label>إلى</label>' + (ro ? '' : '<button class="now" onclick="endEvent(' + j + ')">✅ خلص الآن</button>') + '</div>') + '</div>') +
    '<div style="margin-top:6px"><input value="' + esc(e.text) + '" placeholder="السبب / التفاصيل" oninput="cur.data.events[' + j + '].text=this.value;cur.data.events[' + j + '].cause=this.value;touch()"' + dis + '></div>' +
    (e.type === 'pump_move' ? pumpElement(e, j, dis) : '') + '</div>';

/* نقل المضخة لعنصر تاني: العربيات اللي بعد النقل بتتحسب على العنصر الجديد */
function pumpElement(e, j, dis) {
  if (e.element === undefined && !e._askEl) {
    return dis ? '' : '<button class="btn l mini" style="width:100%;margin-top:6px" onclick="cur.data.events[' + j + ']._askEl=1;renderReport()">↪ النقل ده لعنصر تاني؟</button>';
  }
  if (e.grade_strength === undefined && e.cement_content === undefined) { var g = gradeAt(Math.max(0, (+e.after_row || 1) - 1)); e.grade_strength = g.gs; e.cement_content = g.cc; }
  return '<div style="margin-top:6px;border-top:1px dashed #ccc;padding-top:6px"><label>العنصر بعد النقل (العربيات الجاية هتتحسب عليه)</label>' +
    '<input list="els" value="' + esc(e.element || '') + '" placeholder="مثلاً: سقف الدور التاني" oninput="cur.data.events[' + j + '].element=this.value.trim()||null;touch()"' + dis + '>' +
    '<div class="g2" style="margin-top:6px"><div><label>الإجهاد</label><input inputmode="numeric" value="' + esc(e.grade_strength) + '" oninput="cur.data.events[' + j + '].grade_strength=Number(this.value)||this.value||null;touch()"' + dis + '></div>' +
    '<div><label>الأسمنت</label><input inputmode="numeric" value="' + esc(e.cement_content) + '" oninput="cur.data.events[' + j + '].cement_content=Number(this.value)||this.value||null;touch()"' + dis + '></div></div></div>';
}

// ===================== تسليم واستلام الصبة بين الفنيين =====================

  }).catch(function () { toast('❌ مقدرتش أوصل للسيرفر'); });

// ===================== المشرف: خروج العربيات =====================
var supForm = null;
function syncDispatch(force) {
  var pend = S.disp.filter(function (d) { return !d.synced; });
  if (!pend.length && !force) return;
  syncing = true;
  api({ action: 'dispatch', code: S.code, items: pend }).then(function (res) {
    syncing = false;
    if (S.disp.some(function (d) { return !d.synced && pend.indexOf(d) < 0; })) setTimeout(function () { syncDispatch(false); }, 300);
    if (res && res.ok) { pend.forEach(function (d) { d.synced = true; }); S.dispToday = res.today || []; if (res.clients) S.clients = res.clients; if (res.sites) S.sites = res.sites; if (res.techs) S.techs = res.techs; if (res.plantUrl) S.plantUrl = res.plantUrl; save(); if (!supForm && view !== 'pours' && view !== 'pour') render(); else setNet(); }
    else toast('⚠️ ' + ((res && res.error) || 'مشكلة في الإرسال'));
  }).catch(function () { syncing = false; setNet(); });
}
function renderSup() {
  if (supForm) return renderSupForm();
  var h = '<div style="padding:10px" class="g2"><button class="btn g big" onclick="newDispatch()">🚚 خروج عربية جديدة</button><button class="btn big" onclick="showPours()">🏗 الصبات في المواقع</button></div>';
  var srv = {}; S.dispToday.forEach(function (d) { srv[d.id] = d; });
  var today = new Date().toDateString();
  var list = S.disp.filter(function (d) { return new Date(d.ts).toDateString() === today; }).slice().reverse();
  h += '<div class="card list" style="padding:0">' + (list.map(function (d) {
    var sv = srv[d.id] || {}, st = d.cancelled ? '<span class="st p">ملغية</span>' : !d.synced ? '<span class="st p">⏳ مستنية نت</span>' :
      sv.status === 'عطلانة' ? '<span class="st p">🛠 عطلانة</span>' :
      sv.status === 'وصلت' ? '<span class="st f">✅ وصلت ' + esc(sv.arrival || '') + '</span>' : '<span class="st s">🚚 في الطريق</span>';
    return '<div class="it" onclick="editDispatch(\'' + d.id + '\')"><div><b>' + esc(d.truck) + ' ← ' + esc(d.client) + '</b><br><span class="muted">خرجت ' + esc(d.exit) + ' · ' + esc(d.qty_m3 || '') + ' م³' + (d.exit_slump ? ' · هبوط ' + esc(d.exit_slump) : '') + ' · ' + esc(d.driver || '') + '</span></div>' + st + '</div>';
  }).join('') || '<p class="center muted" style="padding:20px">مفيش عربيات خرجت النهارده</p>') + '</div>';
  h += '<div style="padding:10px" class="g2"><button class="btn l" onclick="syncDispatch(true);toast(\'⏳ بيحدّث…\')">🔄 تحديث</button>' +
    (S.plantUrl ? '<a class="btn l" style="text-align:center;text-decoration:none" target="_blank" href="' + esc(S.plantUrl) + '">🖨 شيت النهارده</a>' : '<span></span>') + '</div><p class="center muted"><a href="#" onclick="logout();return false">خروج</a></p>';
  document.getElementById('app').innerHTML = h;
}
function showPours() {
  if (!navigator.onLine) return toast('محتاج نت');

  api({ action: 'pours', code: S.code }).then(function (r) {
    if (!r.ok) return toast('❌ ' + (r.error || ''));
    var list = r.pours || [];
    var h = '<div class="card"><h3>🏗 الصبات (النهارده وامبارح)</h3>' + (list.length ? '' : '<p class="muted">مفيش صبات</p>') + '</div><div class="card list" style="padding:0">' +
      list.map(function (o) {
        var st = o.done ? '<span class="st f">✅ خلصت</span>' : '<span class="st s">🟢 شغالة</span>';
        var al = (o.reds ? '<span class="badge">🔴 ' + o.reds + '</span> ' : '') + (o.yellows ? '<span class="badge y">🟡 ' + o.yellows + '</span>' : '');
        return '<div class="it" onclick="viewPour(' + o.sid + ')"><div><b>' + esc(o.client) + (o.site ? ' — ' + esc(o.site) : '') + '</b> ' + al +
          '<br><span class="muted">' + esc(o.element) + ' · ' + esc(o.owner) + ' · ' + o.trucks + ' عربية · ' + o.qty + (o.required ? ' من ' + esc(o.required) : '') + ' م³' +
          (o.now ? '<br>🚛 ' + esc(o.now) : '') + '</span></div>' + st + '</div>';
      }).join('') + '</div><div style="padding:10px" class="g2"><button class="btn l" onclick="showPours()">🔄 تحديث</button><button class="btn l" onclick="supForm=null;view=\'home\';render()">رجوع</button></div>';
    view = 'pours'; document.getElementById('app').innerHTML = h; window.scrollTo(0, 0);
  }).catch(function () { toast('❌ مقدرتش أوصل للسيرفر'); });
}
function viewPour(sid) {
  toast('⏳ …');
  api({ action: 'pour', code: S.code, sid: sid }).then(function (r) {
    if (!r.ok) return toast('❌ ' + (r.error || ''));
    var d = r.data || {}, hd = d.header || {}, rows = d.rows || [], ev = d.events || [];
    var h = '<div class="card"><h3>' + esc(hd.client) + (hd.site ? ' — ' + esc(hd.site) : '') + '</h3><div class="muted">' + esc(hd.element || '') + ' · ' +
      esc(hd.grade_strength || '') + (hd.cement_content ? '/' + esc(hd.cement_content) : '') + ' · ' + esc(hd.date || '') + ' · الفني: ' + esc(r.owner) + '</div></div>';
    if ((r.alerts || []).length) h += '<div class="alert y">' + r.alerts.map(esc).join('<br>') + '</div>';
    h += '<div class="card" style="padding:6px;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px;text-align:center">' +
      '<tr style="background:#eef1f4"><th>#</th><th>عربية</th><th>م³</th><th>خروج</th><th>وصول</th><th>بداية</th><th>نهاية</th><th>هبوط</th><th>إضافة</th></tr>';
    rows.forEach(function (x, i) {
      h += '<tr style="border-top:1px solid #ddd' + (x.diverted ? ';color:#999' : '') + '"><td>' + (i + 1) + '</td><td><b>' + esc(x.truck || '') + '</b></td><td>' + esc(x.qty_m3 || '') + '</td><td>' + esc(x.exit || '') +
        '</td><td>' + esc(x.arrival || '') + '</td><td>' + esc(x.start || '') + '</td><td>' + esc(x.end || '') + '</td><td>' + esc(x.slump == null ? '' : x.slump) + '</td><td>' + esc(x.additive_l || '') + '</td></tr>';
      ev.filter(function (e) { return +e.after_row === i + 1; }).forEach(function (e) {
        h += '<tr><td colspan="9" style="text-align:right;background:#fff8d6;font-size:13px">★ ' + esc(e.type_ar || '') + ' ' + esc(e.text || '') + '</td></tr>';
      });
    });
    h += '</table></div>';
    if (r.printUrl) h += '<div style="padding:0 10px"><a class="btn l" style="display:block;text-align:center;text-decoration:none" target="_blank" href="' + esc(r.printUrl) + '">🖨 السايت شيت</a></div>';
    h += '<div style="padding:10px" class="g2"><button class="btn l" onclick="viewPour(' + sid + ')">🔄 تحديث</button><button class="btn l" onclick="showPours()">رجوع</button></div>';
    view = 'pour'; document.getElementById('app').innerHTML = h; window.scrollTo(0, 0);
  }).catch(function () { toast('❌ مقدرتش أوصل للسيرفر'); });
}
function newDispatch() {
  var last = S.disp[S.disp.length - 1] || {};
  supForm = { id: uid(), ts: Date.now(), date: today(), exit: nowHM(), client: last.client || '', site: last.site || '', grade: last.grade || '', qty_m3: last.qty_m3 || 9, truck: '', driver: '', ticket: '', exit_slump: '', temp: '', samples: '', site_tech: last.site_tech || '', sup_note: '' };
  render();
}
function editDispatch(id) { var d = S.disp.filter(function (x) { return x.id === id; })[0]; if (d) { supForm = JSON.parse(JSON.stringify(d)); render(); } }
function sf(k, v) { supForm[k] = v; }
function renderSupForm() {
  var f = supForm, isEdit = S.disp.some(function (x) { return x.id === f.id; });
  function inp(k, lab, attrs) { return '<div><label>' + lab + '</label><input value="' + esc(f[k]) + '" oninput="sf(\'' + k + '\',this.value)" ' + (attrs || '') + '></div>'; }
  var opts = S.clients.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
  document.getElementById('app').innerHTML = '<div class="card"><h3>🚚 خروج عربية</h3>' +
    clientSelects(f.client, f.site, 'pickSup') +
    '<div class="g2" style="margin-top:8px">' + inp('truck', 'رقم العربية', 'placeholder="T12"') + inp('driver', 'السائق') +
    inp('qty_m3', 'الكمية م³', 'inputmode="decimal"') + inp('exit_slump', 'معدل الهبوط', 'inputmode="decimal"') +
    inp('temp', 'الحرارة', 'inputmode="decimal"') + inp('samples', 'عدد العينات', 'inputmode="numeric"') +
    '<div><label>فني الموقع</label><input list="techs" value="' + esc(f.site_tech) + '" oninput="sf(\'site_tech\',this.value)"><datalist id="techs">' + (S.techs || []).map(function (t) { return '<option value="' + esc(t) + '">'; }).join('') + '</datalist></div>' +
    '<div><label>وقت الخروج</label><input type="time" value="' + esc(f.exit) + '" onchange="sf(\'exit\',this.value)"></div>' +
    inp('grade', 'الرتبة', 'placeholder="300/400"') + inp('ticket', 'رقم البون', 'inputmode="numeric"') + '</div>' +
    inp('sup_note', 'ملاحظات') + (isEdit ? '<p class="center"><a href="#" style="color:#c0392b" onclick="cancelDispatch();return false">إلغاء العربية دي (اتسجلت بالغلط)</a></p>' : '') + '</div>' +
    '<div class="bar"><button class="btn l" style="width:30%" onclick="supForm=null;render()">رجوع</button>' +
    (isEdit ? '<button class="btn l" style="width:30%" onclick="markBroken()">🛠 عطلت</button>' : '') +
    '<button class="btn g" onclick="saveDispatch()">✅ ' + (isEdit ? 'حفظ' : 'خرجت') + '</button></div>';
}
function saveDispatch() {
  var f = supForm;
  if (!f.client || !f.truck) return toast('اختار العميل واكتب رقم العربية');
  f.qty_m3 = Number(String(f.qty_m3).replace(',', '.')) || f.qty_m3;
  if (f.samples !== '' && f.samples != null) f.samples = Number(String(f.samples).replace(/[^0-9]/g, '')) || f.samples;
  if (f.exit_slump !== '' && f.exit_slump != null) f.exit_slump = Number(String(f.exit_slump).replace(',', '.')) || f.exit_slump;
  f.synced = false;
  var i = S.disp.map(function (x) { return x.id; }).indexOf(f.id);
  if (i >= 0) S.disp[i] = f; else S.disp.push(f);
  S.disp = S.disp.filter(function (d) { return Date.now() - d.ts < 3 * 86400000 || !d.synced; });
  save(); supForm = null; render(); syncAll(true);
  toast(navigator.onLine ? '✅ اتبعتت' : '📴 اتحفظت — هتتبعت أول ما النت يرجع');
}
function markBroken() {
  var n = prompt('إيه اللي حصل؟ (عطل / غرزت / مكانها فين)');
  if (n === null) return;
  supForm.breakdown = n.trim() || 'عطلت/غرزت'; saveDispatch();
}
function cancelDispatch() { if (!confirm('تلغي العربية دي؟')) return; supForm.cancelled = true; saveDispatch(); }

// ===================== الإمضاء والإنهاء =====================
var cv, cx, drawing = false, hasInk = false;
function openSig() {
  var d = cur.data;
  if (!d.rows.length) return toast('مفيش عربيات');
  var open = d.rows.filter(function (r) { return !r.diverted && !r.end; }).length;
  if (open && !confirm(open + ' عربية لسه ملهاش وقت نهاية. تكمّل الإنهاء؟')) return;
  if ((d.events.length || d.rows.some(function (r) { return r.diverted; })) && !d.footer.problems_text) {
    alert('فيه أحداث (نقل مضخة / وقفة / عربية اتحولت). اكتب المشاكل في خانة «أي مشاكل حدثت بالموقع» الأول — دي اللي بتحمينا لو حصل خلاف.');
    return;
  }
  document.getElementById('sigWrap').style.display = 'flex';
  document.getElementById('sigWho').textContent = 'الفني: ' + S.name + ' — امضي وبعدين «إنهاء وإرسال»';
  cv = document.getElementById('sig'); cx = cv.getContext('2d'); sigClear();
}
function sigClose() { document.getElementById('sigWrap').style.display = 'none'; }
function sigClear() { cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.lineWidth = 6; cx.lineCap = 'round'; cx.strokeStyle = '#0b3d91'; hasInk = false; }
function pos(ev) { var r = cv.getBoundingClientRect(), t = ev.touches ? ev.touches[0] : ev; return [(t.clientX - r.left) * cv.width / r.width, (t.clientY - r.top) * cv.height / r.height]; }
function sigInit() {
  var c = document.getElementById('sig');
  function down(e) { e.preventDefault(); drawing = true; var p = pos(e); cx.beginPath(); cx.moveTo(p[0], p[1]); }
  function move(e) { if (!drawing) return; e.preventDefault(); var p = pos(e); cx.lineTo(p[0], p[1]); cx.stroke(); hasInk = true; }
  function up() { drawing = false; }
  c.addEventListener('mousedown', down); c.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  c.addEventListener('touchstart', down, { passive: false }); c.addEventListener('touchmove', move, { passive: false }); c.addEventListener('touchend', up);
}
function finish() {
  if (!hasInk && !confirm('مفيش إمضاء. تكمّل من غير إمضاء؟')) return;
  cur.data.header.technician = cur.data.header.technician || S.name;
  cur.data.closed = true;
  if (hasInk) { var small = document.createElement('canvas'); small.width = 500; small.height = 200; small.getContext('2d').drawImage(cv, 0, 0, 500, 200); cur.signature = small.toDataURL('image/png'); }
  cur.final = true; touch(); sigClose(); renderReport(); syncAll(true);
  toast(navigator.onLine ? '⏳ بيتبعت…' : '📴 اتحفظ — هيتبعت أول ما النت يرجع');
}

// ===================== حجم الخط =====================
var ZOOMS = [1, 1.15, 1.3, 1.5];
function applyZoom() { var z = ZOOMS[S.zoom || 0]; document.body.style.zoom = ''; document.documentElement.style.setProperty('--z', z); document.body.classList.toggle('zbig', z > 1.1); }
function zoomUp() { S.zoom = ((S.zoom || 0) + 1) % ZOOMS.length; save(); applyZoom(); toast('حجم الخط: ' + Math.round(ZOOMS[S.zoom] * 100) + '%'); }

// ===================== تشغيل =====================
applyZoom();
sigInit();
render();
syncAll(true);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
